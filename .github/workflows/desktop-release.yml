name: Desktop release

# Build Reality Deck installers and upload to an existing pytxo-releases tag.
# Actions → Desktop release → version 0.3.4 (no v prefix)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver (no v prefix), e.g. 0.3.4"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG_NAME: v${{ inputs.version }}
  NPM_VERSION: ${{ inputs.version }}

jobs:
  desktop-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            asset_prefix: pytxo-reality-deck-linux-x64
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            asset_prefix: pytxo-reality-deck-darwin-arm64
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            asset_prefix: pytxo-reality-deck-darwin-x64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset_prefix: pytxo-reality-deck-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Sync desktop version
        shell: bash
        run: |
          VERSION="${{ env.NPM_VERSION }}"
          node -e "
          const fs = require('fs');
          const v = process.argv[1];
          for (const p of ['apps/desktop/package.json', 'apps/desktop/src-tauri/tauri.conf.json']) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          }
          " "$VERSION"

      - name: npm ci (tooling + desktop icons)
        run: |
          npm ci --prefix tooling
          node tooling/scripts/generate-deck-icons.mjs
          test -f apps/desktop/src-tauri/icons/icon.ico
          test -f apps/desktop/src-tauri/icons/icon.icns

      - name: npm ci (desktop)
        working-directory: apps/desktop
        run: npm ci

      - name: Configure CI signing/updater
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            node -e "
            const fs = require('fs');
            const p = 'apps/desktop/src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            "
            echo "createUpdaterArtifacts=false (no TAURI_SIGNING_PRIVATE_KEY)"
          fi

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG_NAME }}
          releaseName: ${{ env.TAG_NAME }}
          releaseDraft: true
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false
          args: --target ${{ matrix.rust_target }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_prefix }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*
          if-no-files-found: error

  mirror-desktop-release:
    needs: desktop-release
    if: always() && !cancelled() && needs.desktop-release.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PYTXO_RELEASES_TOKEN
        id: token
        env:
          PYTXO_RELEASES_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          if [ -n "${PYTXO_RELEASES_TOKEN}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::PYTXO_RELEASES_TOKEN not set"
            exit 1
          fi

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pytxo-reality-deck-*
          path: desktop-dist
          merge-multiple: true

      - name: Stage desktop installers for pytxo-releases
        run: |
          set -euo pipefail
          mkdir -p dist
          find desktop-dist -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \) | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *.msi) dest="pytxo-reality-deck-windows-x64.msi" ;;
              *aarch64*.dmg|*arm64*.dmg) dest="pytxo-reality-deck-darwin-arm64.dmg" ;;
              *x86_64*.dmg|*x64*.dmg) dest="pytxo-reality-deck-darwin-x64.dmg" ;;
              *.AppImage) dest="pytxo-reality-deck-linux-x64.AppImage" ;;
              *) continue ;;
            esac
            cp "$f" "dist/$dest"
            echo "staged $f → dist/$dest"
          done
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No desktop installers staged"
            exit 1
          fi
          ls -la dist/

      - name: Upload to pytxo-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: Pytxo-dev/pytxo-releases
          token: ${{ secrets.PYTXO_RELEASES_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: false
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
