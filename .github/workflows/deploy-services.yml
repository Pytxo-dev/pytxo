name: Deploy services

on:
  push:
    branches: [main]
    paths:
      - "services/pytxo-link/**"
      - "services/pytxo-cloud-sandbox/**"
      - "services/pytxo-proxy/**"
      - ".github/workflows/deploy-services.yml"
  workflow_dispatch:

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - pytxo-link
          - pytxo-cloud-sandbox
          - pytxo-proxy
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build ${{ matrix.service }}
        run: cargo build --release -p ${{ matrix.service }}

      - name: Docker build ${{ matrix.service }}
        if: matrix.service != 'pytxo-proxy' || hashFiles('services/pytxo-proxy/Dockerfile') != ''
        run: |
          if [ -f "services/${{ matrix.service }}/Dockerfile" ]; then
            docker build -f "services/${{ matrix.service }}/Dockerfile" -t "pytxo/${{ matrix.service }}:ci" .
          else
            echo "::notice::No Dockerfile for ${{ matrix.service }}; cargo build only"
          fi

  # Railway deploy is manual or via `railway up` — this workflow validates release artifacts.
  smoke:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release -p pytxo-link
          cargo build --release -p pytxo-cloud-sandbox
          cargo build --release -p pytxo-proxy

      - name: Health smoke pytxo-link (ADR-0027)
        run: |
          LINK_BIND=127.0.0.1:18787 ./target/release/pytxo-link &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18787/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18787/health | jq -e '.status == "ok" and (.uptime_secs | type) == "number" and .service == "pytxo-link"'

      - name: Health smoke pytxo-cloud-sandbox (ADR-0027)
        run: |
          CLOUD_BIND=127.0.0.1:18788 ./target/release/pytxo-cloud-sandbox &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18788/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18788/health | jq -e '.status == "ok" and (.uptime_secs | type) == "number" and .service == "pytxo-cloud-sandbox"'

      - name: Health smoke pytxo-proxy (ADR-0027)
        run: |
          PROXY_BIND=127.0.0.1:18790 PROXY_REQUIRE_AUTH=0 ./target/release/pytxo-proxy &
          pid=$!
          trap "kill $pid 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18790/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18790/health | jq -e '.status == "ok" and (.uptime_secs | type) == "number" and .service == "pytxo-proxy"'

      - name: Service contract unit tests
        run: |
          cargo test -p pytxo-link
          cargo test -p pytxo-proxy
          cargo test -p pytxo-cloud-sandbox
          cargo test -p pytxo-core service_health
