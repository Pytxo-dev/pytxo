name: Desktop acceptance (cloud Windows)

# Native acceptance of the candidate MSI on disposable GitHub-hosted Windows
# runners: clean install, the full mixed-agent journey with deterministic
# stand-in agent CLIs, 150%/200% layout passes, and a retained-data upgrade from
# the public v1.2.1. Nothing here runs on a developer machine, signs, tags or
# publishes. Stand-in agents prove Pytxo's own behavior, not vendor agents.
on:
  workflow_dispatch:
  push:
    branches: [2ntt/pytxo-beta-candidate-20261003]

permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    if: github.repository == 'Pytxo-dev/pytxo'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # A pinned run id reuses an already built candidate while acceptance
      # scripts change; otherwise wait for this exact commit's build-only run.
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned="$(tr -d '[:space:]' < tooling/acceptance/candidate-run.txt 2>/dev/null || true)"
          if [ -n "$pinned" ]; then
            echo "Using pinned candidate run $pinned"
            echo "run_id=$pinned" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for attempt in $(seq 1 140); do
            row="$(gh run list -R "$GITHUB_REPOSITORY" --workflow desktop-candidate.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"')"
            set -- $row
            if [ "${2:-}" = completed ]; then
              [ "${3:-}" = success ] || { echo "Candidate build $1 concluded ${3:-unknown}"; exit 1; }
              echo "run_id=$1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "Candidate build for $GITHUB_SHA did not finish in time"; exit 1

  install-and-journey:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install the browser driver used over CDP
        run: npm ci --prefix apps/desktop
      - name: Download the candidate MSI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ needs.candidate.outputs.run_id }} -R $env:GITHUB_REPOSITORY -p "desktop-candidate-*" -D candidate
      - name: Clean install, mixed-agent journey, 150% and 200% layout
        shell: pwsh
        run: |
          $msi = Get-ChildItem candidate -Recurse -File -Filter *.msi | Where-Object { $_.FullName -notmatch '\\payload\\' } | Select-Object -First 1
          ./tooling/acceptance/run-acceptance.ps1 -Msi $msi.FullName -Evidence acceptance
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-acceptance-${{ github.sha }}
          path: acceptance/
          if-no-files-found: warn
          retention-days: 14

  upgrade:
    needs: candidate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci --prefix apps/desktop
      - name: Download the candidate MSI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ needs.candidate.outputs.run_id }} -R $env:GITHUB_REPOSITORY -p "desktop-candidate-*" -D candidate
      - name: Upgrade from public v1.2.1 with retained data
        shell: pwsh
        run: |
          $msi = Get-ChildItem candidate -Recurse -File -Filter *.msi | Where-Object { $_.FullName -notmatch '\\payload\\' } | Select-Object -First 1
          ./tooling/acceptance/upgrade.ps1 -Msi $msi.FullName -Evidence upgrade
      - name: Upload upgrade evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-upgrade-${{ github.sha }}
          path: upgrade/
          if-no-files-found: warn
          retention-days: 14

  footage:
    needs: install-and-journey
    if: always() && needs.install-and-journey.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-acceptance-${{ github.sha }}
          path: acceptance
      - name: Assemble the continuous journey recording
        run: |
          [ -f acceptance/journey/frames.txt ] || { echo "No frames recorded"; exit 0; }
          cd acceptance/journey
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i frames.txt -vf "fps=30,scale=trunc(iw/2)*2:trunc(ih/2)*2,format=yuv420p" -c:v libx264 -crf 18 -y journey.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 journey.mp4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-acceptance-footage-${{ github.sha }}
          path: acceptance/journey/journey.mp4
          if-no-files-found: ignore
          retention-days: 14
