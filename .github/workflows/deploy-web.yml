name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/chroma/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Pytxo-dev/pytxo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Deploy production from main
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            # Production deploys use the Vercel CLI until these secrets exist; a red
            # run on every main push would hide real failures.
            echo "::warning::Not deployed: set VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID (project prj_2741otn0udtebonWb6wVx7EH8UiO, root apps/web)."
            exit 0
          fi
          npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
