name: Release

# One-click: Actions → Release → Run workflow → enter version (e.g. 0.3.1)
# Or from CLI: git tag v0.3.1 && git push origin v0.3.1
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver (no v prefix), e.g. 0.3.1"
        required: true
        type: string
      publish_npm:
        description: "Publish packages/pytxo to npm"
        required: true
        type: boolean
        default: true
      mirror_public:
        description: "Mirror binaries to public Pytxo-dev/pytxo-releases"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  NPM_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: pytxo-linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: pytxo-linux-arm64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: pytxo-darwin-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: pytxo-darwin-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: pytxo-windows-x64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build pytxo-cli
        run: cargo build -p pytxo-cli --release --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/pytxo${{ matrix.ext }}"
          DEST="dist/${{ matrix.asset_name }}${{ matrix.ext }}"
          cp "$SRC" "$DEST"
          chmod +x "dist/${{ matrix.asset_name }}${{ matrix.ext }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.TAG_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          cd dist
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -type d -not -path . -exec rm -rf {} + 2>/dev/null || true
          ls -la

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum pytxo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create private repo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          body_path: RELEASE.md
          files: |
            dist/*
            dist/SHA256SUMS.txt

      - name: Upload artifacts for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/

  mirror-public-release:
    needs: release
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.mirror_public)
        || github.event_name == 'push'
      }}
    steps:
      - uses: actions/checkout@v4

      - name: Check PYTXO_RELEASES_TOKEN
        id: token
        env:
          PYTXO_RELEASES_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          if [ -n "${PYTXO_RELEASES_TOKEN}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PYTXO_RELEASES_TOKEN not set — skipping public mirror"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        if: steps.token.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Mirror to public pytxo-releases
        if: steps.token.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Pytxo-dev/pytxo-releases
          token: ${{ secrets.PYTXO_RELEASES_TOKEN }}
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          generate_release_notes: true
          body_path: RELEASE.md
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}

      - name: Sync install scripts to pytxo-releases
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Pytxo-dev/pytxo-releases.git" "$WORK"
          cp distribution/pytxo-releases/install.sh "$WORK/install.sh"
          cp distribution/pytxo-releases/install.ps1 "$WORK/install.ps1"
          cp distribution/pytxo-releases/README.md "$WORK/README.md"
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install.sh install.ps1 README.md
          if git diff --staged --quiet; then
            echo "Install scripts unchanged"
          else
            git commit -m "Sync install scripts from pytxo ${{ needs.release.outputs.tag }}"
            git push origin HEAD:main
          fi

  npm:
    needs: release
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
        || github.event_name == 'push'
      }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync npm package version
        run: |
          VERSION="${{ env.NPM_VERSION }}"
          VERSION="${VERSION#v}"
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const path = "packages/pytxo/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.version = version;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          console.log(`packages/pytxo → ${version}`);
          NODE
        env:
          VERSION: ${{ env.NPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        working-directory: packages/pytxo
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping npm publish"
            exit 0
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
