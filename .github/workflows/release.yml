name: Release

# One-click: Actions → Release → Run workflow → enter version (e.g. 0.3.1)
# Or from CLI: git tag v0.3.1 && git push origin v0.3.1
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver (no v prefix), e.g. 0.3.1"
        required: true
        type: string
      publish_npm:
        description: "Publish packages/pytxo to npm"
        required: true
        type: boolean
        default: true
      mirror_public:
        description: "Mirror binaries to public Pytxo-dev/pytxo-releases"
        required: true
        type: boolean
        default: true
      sign_desktop:
        description: "Sign Desktop installers (requires valid Apple/Windows signing secrets)"
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  NPM_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release-gate:
    uses: ./.github/workflows/ci.yml

  source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require exact version metadata and protected-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${NPM_VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release version: ${NPM_VERSION}"
            exit 1
          fi
          node tooling/scripts/verify-release-version.mjs "$VERSION"
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release commit $GITHUB_SHA is not reachable from protected main"
            exit 1
          fi

  build:
    needs: [release-gate, source-guard]
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: pytxo-linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: pytxo-linux-arm64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: pytxo-darwin-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: pytxo-darwin-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: pytxo-windows-x64
            ext: .exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Verify shared release version
        shell: bash
        run: |
          VERSION="${NPM_VERSION#v}"
          node tooling/scripts/verify-release-version.mjs "$VERSION"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build pytxo-cli
        run: cargo build -p pytxo-cli --release --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/pytxo${{ matrix.ext }}"
          DEST="dist/${{ matrix.asset_name }}${{ matrix.ext }}"
          cp "$SRC" "$DEST"
          chmod +x "dist/${{ matrix.asset_name }}${{ matrix.ext }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.TAG_NAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare clean release staging
        run: rm -rf dist

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          cd dist
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -type d -not -path . -exec rm -rf {} + 2>/dev/null || true
          ls -la

      - name: Require the exact CLI release matrix
        working-directory: dist
        run: |
          set -euo pipefail
          expected=(
            pytxo-linux-x64
            pytxo-linux-arm64
            pytxo-darwin-arm64
            pytxo-darwin-x64
            pytxo-windows-x64.exe
          )
          for asset in "${expected[@]}"; do
            test -s "$asset" || { echo "::error::Missing required release asset: $asset"; exit 1; }
          done
          mapfile -t actual < <(find . -maxdepth 1 -type f -name 'pytxo-*' -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum pytxo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Require the exact CLI publish inventory
        run: node tooling/scripts/verify-release-inventory.mjs cli dist

      - name: Prepare release notes body
        run: |
          VERSION="${{ env.NPM_VERSION }}"
          VERSION="${VERSION#v}"
          NOTES="distribution/release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" RELEASE_BODY.md
            echo "Using $NOTES for release body"
          else
            echo "::error::Missing versioned release notes: $NOTES"
            exit 1
          fi

      - name: Create private repo release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: dist/*
          fail_on_unmatched_files: true

      - name: Upload artifacts for downstream jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/

  mirror-public-release:
    needs: release
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.mirror_public)
        || github.event_name == 'push'
      }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare clean CLI mirror staging
        run: rm -rf dist

      - name: Check PYTXO_RELEASES_TOKEN
        env:
          PYTXO_RELEASES_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          if [ -z "${PYTXO_RELEASES_TOKEN}" ]; then
            echo "::error::PYTXO_RELEASES_TOKEN is required before public npm publication"
            exit 1
          fi

      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Require the exact CLI mirror inventory
        run: node tooling/scripts/verify-release-inventory.mjs cli dist

      - name: Prepare release notes body
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES="distribution/release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" RELEASE_BODY.md
          else
            cp RELEASE.md RELEASE_BODY.md
          fi

      - name: Mirror to public pytxo-releases
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: Pytxo-dev/pytxo-releases
          token: ${{ secrets.PYTXO_RELEASES_TOKEN }}
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: |
            dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}

      - name: Sync install scripts to pytxo-releases
        env:
          GH_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Pytxo-dev/pytxo-releases.git" "$WORK"
          cp distribution/pytxo-releases/install.sh "$WORK/install.sh"
          cp distribution/pytxo-releases/install.ps1 "$WORK/install.ps1"
          cp distribution/pytxo-releases/README.md "$WORK/README.md"
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install.sh install.ps1 README.md
          if git diff --staged --quiet; then
            echo "Install scripts unchanged"
          else
            git commit -m "Sync install scripts from pytxo ${{ needs.release.outputs.tag }}"
            git push origin HEAD:main
          fi

  desktop-release:
    needs: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset_prefix: pytxo-desktop-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Sync desktop version
        shell: bash
        run: |
          VERSION="${{ env.NPM_VERSION }}"
          VERSION="${VERSION#v}"
          node -e "
          const fs = require('fs');
          const v = process.argv[1];
          for (const p of ['apps/desktop/package.json', 'apps/desktop/src-tauri/tauri.conf.json']) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          }
          " "$VERSION"

      - name: npm ci (tooling + desktop icons)
        run: |
          npm ci --prefix tooling
          node tooling/scripts/generate-deck-icons.mjs
          test -f apps/desktop/src-tauri/icons/icon.ico
          test -f apps/desktop/src-tauri/icons/icon.icns

      - name: npm ci (desktop)
        working-directory: apps/desktop
        run: npm ci

      - name: Configure CI signing/updater
        shell: bash
        run: |
          HAS_KEY="false"
          if [ -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then HAS_KEY="true"; fi
          node -e "
          const fs = require('fs');
          const p = 'apps/desktop/src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.bundle.createUpdaterArtifacts = process.argv[1] === 'true';
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          " "$HAS_KEY"
          echo "createUpdaterArtifacts=$HAS_KEY"

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Code-signing is opt-in. This prevents a malformed or stale signing
          # secret from blocking an otherwise valid unsigned distribution.
          APPLE_CERTIFICATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop == true) && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop == true) && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop == true) && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop == true) && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop == true) && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop == true) && secrets.APPLE_API_KEY_ID || '' }}
          WINDOWS_CERTIFICATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop == true) && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_desktop == true) && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG_NAME }}
          releaseName: ${{ env.TAG_NAME }}
          releaseBody: "Pytxo Desktop installers"
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeUpdaterJson: false
          args: --target ${{ matrix.rust_target }} --features voice-whisper

      - name: Upload desktop artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset_prefix }}
          path: |
            target/${{ matrix.rust_target }}/release/bundle/**/*
          if-no-files-found: error

  mirror-desktop-release:
    needs: [release, desktop-release]
    if: >-
      ${{
        always() && !cancelled() && needs.release.result == 'success'
        && needs.desktop-release.result == 'success'
        && ((github.event_name == 'workflow_dispatch' && inputs.mirror_public) || github.event_name == 'push')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check PYTXO_RELEASES_TOKEN
        id: token
        env:
          PYTXO_RELEASES_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          if [ -z "${PYTXO_RELEASES_TOKEN}" ]; then
            echo "::error::PYTXO_RELEASES_TOKEN is required when public mirroring is enabled"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Download desktop artifacts
        if: steps.token.outputs.ok == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: pytxo-desktop-*
          path: desktop-dist

      - name: Stage desktop installers for pytxo-releases
        if: steps.token.outputs.ok == 'true'
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          find desktop-dist -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \) | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *.msi) dest="pytxo-desktop-windows-x64.msi" ;;
              *aarch64*.dmg|*arm64*.dmg) dest="pytxo-desktop-darwin-arm64.dmg" ;;
              *x86_64*.dmg|*x64*.dmg) dest="pytxo-desktop-darwin-x64.dmg" ;;
              *.AppImage) dest="pytxo-desktop-linux-x64.AppImage" ;;
              *) continue ;;
            esac
            cp "$f" "dist/$dest"
            echo "staged $f → dist/$dest"
          done
          test -s dist/pytxo-desktop-windows-x64.msi || {
            echo "::error::Missing required Windows x64 Desktop MSI"
            exit 1
          }
          if find dist -maxdepth 1 -type f \( -name '*darwin*' -o -name '*linux*' \) | grep -q .; then
            echo "::error::Unexpected non-Windows Desktop artifact in the Windows-first v1.2 release"
            exit 1
          fi
          ls -la dist/

      - name: Build updater manifest (latest.json)
        if: steps.token.outputs.ok == 'true'
        env:
          TAG_NAME: ${{ needs.release.outputs.tag }}
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PYTXO_DESKTOP_PLATFORMS: windows-x86_64
        run: node tooling/scripts/build-updater-manifest.mjs desktop-dist dist

      - name: Generate Desktop checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum pytxo-desktop-windows-x64.msi > DESKTOP_SHA256SUMS.txt
          cat DESKTOP_SHA256SUMS.txt

      - name: Require the exact Desktop mirror inventory
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: node tooling/scripts/verify-release-inventory.mjs desktop dist

      - name: Mirror desktop to public pytxo-releases
        if: steps.token.outputs.ok == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: Pytxo-dev/pytxo-releases
          token: ${{ secrets.PYTXO_RELEASES_TOKEN }}
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}

  npm:
    needs: [release, mirror-public-release]
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
        || github.event_name == 'push'
      }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sync npm package version
        run: |
          VERSION="${{ env.NPM_VERSION }}"
          VERSION="${VERSION#v}"
          export VERSION
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const path = "packages/pytxo/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.version = version;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          console.log(`packages/pytxo → ${version}`);
          NODE

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        working-directory: packages/pytxo
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN secret is required when npm publication is enabled"
            exit 1
          fi
          set +e
          npm publish --access public
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if npm view "pytxo@${NPM_VERSION}" version >/dev/null 2>&1; then
              echo "::warning::pytxo@${NPM_VERSION} already on npm — skipping"
              exit 0
            fi
            exit "$code"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_VERSION: ${{ env.NPM_VERSION }}
