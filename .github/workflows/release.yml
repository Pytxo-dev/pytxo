name: Release

# One-click: Actions → Release → Run workflow → enter version (e.g. 0.3.1)
# Or from CLI: git tag v0.3.1 && git push origin v0.3.1
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver (no v prefix), e.g. 0.3.1"
        required: true
        type: string
      publish_npm:
        description: "Publish packages/pytxo to npm"
        required: true
        type: boolean
        default: true
      mirror_public:
        description: "Mirror binaries to public Pytxo-dev/pytxo-releases"
        required: true
        type: boolean
        default: true
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  NPM_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: pytxo-linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: pytxo-linux-arm64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: pytxo-darwin-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: pytxo-darwin-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: pytxo-windows-x64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build pytxo-cli
        run: cargo build -p pytxo-cli --release --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/pytxo${{ matrix.ext }}"
          DEST="dist/${{ matrix.asset_name }}${{ matrix.ext }}"
          cp "$SRC" "$DEST"
          chmod +x "dist/${{ matrix.asset_name }}${{ matrix.ext }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}${{ matrix.ext }}

  release:
    needs: build
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ env.TAG_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Require at least one platform binary
        run: |
          shopt -s nullglob
          files=(dist/pytxo-*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release binaries uploaded from build matrix"
            exit 1
          fi
          ls -la dist/

      - name: Flatten artifacts
        run: |
          cd dist
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -type d -not -path . -exec rm -rf {} + 2>/dev/null || true
          ls -la

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum pytxo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release notes body
        run: |
          VERSION="${{ env.NPM_VERSION }}"
          VERSION="${VERSION#v}"
          NOTES="distribution/release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" RELEASE_BODY.md
            echo "Using $NOTES for release body"
          else
            cp RELEASE.md RELEASE_BODY.md
            echo "::warning::Missing $NOTES — falling back to RELEASE.md"
          fi

      - name: Create private repo release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: dist/*

      - name: Upload artifacts for downstream jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/

  mirror-public-release:
    needs: release
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.mirror_public)
        || github.event_name == 'push'
      }}
    steps:
      - uses: actions/checkout@v4

      - name: Check PYTXO_RELEASES_TOKEN
        id: token
        env:
          PYTXO_RELEASES_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          if [ -n "${PYTXO_RELEASES_TOKEN}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PYTXO_RELEASES_TOKEN not set — skipping public mirror"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release assets
        if: steps.token.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Prepare release notes body
        if: steps.token.outputs.ok == 'true'
        run: |
          TAG="${{ needs.release.outputs.tag }}"
          VERSION="${TAG#v}"
          NOTES="distribution/release-notes/v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" RELEASE_BODY.md
          else
            cp RELEASE.md RELEASE_BODY.md
          fi

      - name: Mirror to public pytxo-releases
        if: steps.token.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Pytxo-dev/pytxo-releases
          token: ${{ secrets.PYTXO_RELEASES_TOKEN }}
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          generate_release_notes: false
          body_path: RELEASE_BODY.md
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}

      - name: Sync install scripts to pytxo-releases
        if: steps.token.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Pytxo-dev/pytxo-releases.git" "$WORK"
          cp distribution/pytxo-releases/install.sh "$WORK/install.sh"
          cp distribution/pytxo-releases/install.ps1 "$WORK/install.ps1"
          cp distribution/pytxo-releases/README.md "$WORK/README.md"
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add install.sh install.ps1 README.md
          if git diff --staged --quiet; then
            echo "Install scripts unchanged"
          else
            git commit -m "Sync install scripts from pytxo ${{ needs.release.outputs.tag }}"
            git push origin HEAD:main
          fi

  desktop-release:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            asset_prefix: pytxo-reality-deck-linux-x64
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            asset_prefix: pytxo-reality-deck-darwin-arm64
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            asset_prefix: pytxo-reality-deck-darwin-x64
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset_prefix: pytxo-reality-deck-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Sync desktop version
        shell: bash
        run: |
          VERSION="${{ env.NPM_VERSION }}"
          VERSION="${VERSION#v}"
          node -e "
          const fs = require('fs');
          const v = process.argv[1];
          for (const p of ['apps/desktop/package.json', 'apps/desktop/src-tauri/tauri.conf.json']) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = v;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          }
          " "$VERSION"

      - name: npm ci (tooling + desktop icons)
        run: |
          npm ci --prefix tooling
          node tooling/scripts/generate-deck-icons.mjs
          test -f apps/desktop/src-tauri/icons/icon.ico
          test -f apps/desktop/src-tauri/icons/icon.icns

      - name: npm ci (desktop)
        working-directory: apps/desktop
        run: npm ci

      - name: Configure CI signing/updater
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            node -e "
            const fs = require('fs');
            const p = 'apps/desktop/src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            "
            echo "createUpdaterArtifacts=false (no TAURI_SIGNING_PRIVATE_KEY)"
          fi

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.TAG_NAME }}
          releaseName: ${{ env.TAG_NAME }}
          releaseBody: "Reality Deck desktop installers"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_prefix }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*
          if-no-files-found: warn

  mirror-desktop-release:
    needs: [release, desktop-release]
    if: >-
      ${{
        always() && !cancelled() && needs.release.result == 'success'
        && ((github.event_name == 'workflow_dispatch' && inputs.mirror_public) || github.event_name == 'push')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check PYTXO_RELEASES_TOKEN
        id: token
        env:
          PYTXO_RELEASES_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}
        run: |
          if [ -n "${PYTXO_RELEASES_TOKEN}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::PYTXO_RELEASES_TOKEN not set — skipping desktop mirror"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download desktop artifacts
        if: steps.token.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: pytxo-reality-deck-*
          path: desktop-dist
          merge-multiple: true

      - name: Stage desktop installers for pytxo-releases
        if: steps.token.outputs.ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p dist
          find desktop-dist -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' -o -name 'latest.json' -o -name '*.sig' \) | while read -r f; do
            base="$(basename "$f")"
            case "$base" in
              *.msi) dest="pytxo-reality-deck-windows-x64.msi" ;;
              *aarch64*.dmg|*arm64*.dmg) dest="pytxo-reality-deck-darwin-arm64.dmg" ;;
              *x86_64*.dmg|*x64*.dmg) dest="pytxo-reality-deck-darwin-x64.dmg" ;;
              *.AppImage) dest="pytxo-reality-deck-linux-x64.AppImage" ;;
              latest.json|*.sig) dest="$base" ;;
              *) continue ;;
            esac
            cp "$f" "dist/$dest"
            echo "staged $f → dist/$dest"
          done
          ls -la dist/ || true

      - name: Mirror desktop to public pytxo-releases
        if: steps.token.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: Pytxo-dev/pytxo-releases
          token: ${{ secrets.PYTXO_RELEASES_TOKEN }}
          tag_name: ${{ needs.release.outputs.tag }}
          name: ${{ needs.release.outputs.tag }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.PYTXO_RELEASES_TOKEN }}

  npm:
    needs: release
    runs-on: ubuntu-latest
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
        || github.event_name == 'push'
      }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync npm package version
        run: |
          VERSION="${{ env.NPM_VERSION }}"
          VERSION="${VERSION#v}"
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.VERSION;
          const path = "packages/pytxo/package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.version = version;
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
          console.log(`packages/pytxo → ${version}`);
          NODE
        env:
          VERSION: ${{ env.NPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        working-directory: packages/pytxo
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret is not set — skipping npm publish"
            exit 0
          fi
          set +e
          npm publish --access public
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            if npm view "pytxo@${NPM_VERSION}" version >/dev/null 2>&1; then
              echo "::warning::pytxo@${NPM_VERSION} already on npm — skipping"
              exit 0
            fi
            exit "$code"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_VERSION: ${{ env.NPM_VERSION }}
