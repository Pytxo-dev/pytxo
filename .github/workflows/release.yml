name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: pytxo-linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: pytxo-linux-arm64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: pytxo-darwin-arm64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: pytxo-darwin-x64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: pytxo-windows-x64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo build pytxo-cli
        run: cargo build -p pytxo-cli --release --target ${{ matrix.target }}

      - name: Stage release binary
        shell: bash
        run: |
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/pytxo${{ matrix.ext }}"
          DEST="dist/${{ matrix.asset_name }}${{ matrix.ext }}"
          cp "$SRC" "$DEST"
          chmod +x "dist/${{ matrix.asset_name }}${{ matrix.ext }}" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Flatten artifacts
        run: |
          cd dist
          find . -mindepth 2 -type f -exec mv -n {} . \;
          find . -type d -not -path . -exec rm -rf {} + 2>/dev/null || true
          ls -la

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum pytxo-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE.md
          files: |
            dist/*
            dist/SHA256SUMS.txt

  npm:
    needs: release
    if: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Publish npm package
        working-directory: packages/pytxo
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
