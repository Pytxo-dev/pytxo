name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR checks may stop. Main and reusable release checks keep a
# run-specific group, so a newer push cannot cancel publication prerequisites.
concurrency:
  group: pytxo-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    # The last successful Windows job took 36 minutes; retain cold-build margin.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Bound Linux test build storage
        if: runner.os == 'Linux'
        run: |
          # Full workspace test binaries exceed the ephemeral disk with symbols
          # and incremental copies. Keep debug assertions and every test enabled.
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_DEV_DEBUG=0" >> "$GITHUB_ENV"
          echo "CARGO_PROFILE_TEST_DEBUG=0" >> "$GITHUB_ENV"

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and pin Windows owned-launch test helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p pytxo-cli --bin pytxo-attempt-host --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = (Resolve-Path -LiteralPath target/debug/pytxo-attempt-host.exe).Path
          $digest = (Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant()
          "PYTXO_TEST_ATTEMPT_HOST=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYTXO_TEST_ATTEMPT_HOST_SHA256=$digest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: cargo test
        run: cargo test --workspace

      - name: Unix reviewed-file mode and recovery matrix
        if: runner.os == 'Linux'
        run: cargo test -p pytxo-runner --test run_change_set unix_

      - name: cargo audit
        shell: bash
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit

      # The workspace clippy/test pass can consume nearly the full hosted Linux
      # runner disk. Rebuild the smaller feature matrix from a clean target so
      # later links fail on code, not on an exhausted ephemeral filesystem.
      - name: Reclaim Linux disk before feature matrix
        if: runner.os == 'Linux'
        run: cargo clean

      - name: Link HTTP reconciler (feature)
        run: |
          cargo test -p pytxo-core --features link-http
          cargo test -p pytxo-orchestrate --test billing_link

      - name: Overlay layer POC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev
          cargo test -p pytxo-runner --features overlay-fuse overlay_layer
          # kernel_overlay_smoke needs CAP_SYS_ADMIN; compile-only on CI.
          cargo test -p pytxo-runner --features overlay-fuse-kernel --lib --no-run

      - name: Overlay kernel POC (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p pytxo-runner --features overlay-projfs

      - name: Overlay fuse POC (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p pytxo-runner --features overlay-fuse-macos --lib --no-run

      - name: DeepSpace network isolation (Linux compile)
        if: runner.os == 'Linux'
        run: cargo test -p pytxo-runner network_policy --no-run

      - name: Cloud sandbox client (feature)
        run: |
          cargo test -p pytxo-orchestrate --test cloud_sandbox
          cargo test -p pytxo-orchestrate --test mcp_proxy

  benchmarks:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build pytxo CLI
        run: cargo build -p pytxo-cli

      - name: Three-agent preflight (Linux)
        if: runner.os == 'Linux'
        run: bash tooling/benchmarks/three-agent-preflight.sh

      - name: Three-agent preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tooling/benchmarks/three-agent-preflight.ps1

      - name: Overlay vs worktree benchmark (Linux)
        if: runner.os == 'Linux'
        run: bash tooling/benchmarks/overlay-vs-worktree.sh

      - name: Overlay vs worktree benchmark (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tooling/benchmarks/overlay-vs-worktree.ps1

      - name: Overlay layer compile (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev
          cargo test -p pytxo-runner --features overlay-fuse overlay_layer --lib --no-run

      - name: Multi-agent RAM sample (Linux)
        if: runner.os == 'Linux'
        run: bash tooling/benchmarks/multi-agent-ram.sh

  npm-cli:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify shared release version
        run: |
          node tooling/scripts/verify-release-version.mjs
          node --test tooling/scripts/encode-png-ico.test.mjs tooling/scripts/verify-release-version.test.mjs tooling/scripts/verify-release-inventory.test.mjs tooling/scripts/verify-windows-runtime.test.mjs
      # Reject metadata errors before spending minutes compiling the CLI.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build pytxo binary
        run: cargo build -p pytxo-cli --release
      - name: Smoke npm wrapper with local binary
        run: |
          mkdir -p packages/pytxo/vendor
          cp target/release/pytxo packages/pytxo/vendor/pytxo
          chmod +x packages/pytxo/vendor/pytxo
          PYTXO_SKIP_DOWNLOAD=1 node packages/pytxo/bin/pytxo.js --version

  test-env-smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build pytxo binary
        run: cargo build -p pytxo-cli --release
      - name: ADE test env smoke (echo profile)
        run: bash tooling/test-envs/ci-smoke.sh

      - name: Hypervisor shell smoke (echo profile)
        run: bash tooling/test-envs/shell-smoke.sh

  web:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
      - name: npm ci, verify, and build
        working-directory: apps/web
        env:
          # Clerk validates the public key during static prerendering. Production
          # deployments replace this non-routable CI key with the Vercel secret.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: |
          npm ci --legacy-peer-deps
          npm audit --omit=dev --audit-level=high
          npm run lint
          npx playwright install --with-deps chromium
          npm run build
          npm run e2e

  desktop-frontend:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: npm ci and check
        working-directory: apps/desktop
        run: |
          npm ci --prefix ../../tooling
          node ../../tooling/scripts/generate-deck-icons.mjs
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
      - name: Playwright shell E2E
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          npm run e2e
      - name: Storybook build and accessibility gate
        working-directory: apps/desktop
        run: |
          npm run storybook:build
          npm run storybook:test:ci

  desktop-tauri:
    timeout-minutes: 60
    needs: desktop-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: Build release desktop with current frontend
        working-directory: apps/desktop
        run: npm run build:native

      - name: cargo test pytxo-desktop
        run: cargo test -p pytxo-desktop

  pytxo-link:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo test pytxo-link
        run: cargo test -p pytxo-link
      - name: cargo build pytxo-link
        run: cargo build -p pytxo-link --release

  pytxo-cloud-sandbox:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo build pytxo-cloud-sandbox
        run: cargo build -p pytxo-cloud-sandbox --release
