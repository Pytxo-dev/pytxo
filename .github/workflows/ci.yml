name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR checks may stop. Main and reusable release checks keep a
# run-specific group, so a newer push cannot cancel publication prerequisites.
concurrency:
  group: pytxo-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Lean debug builds: no incremental state or debug info to compile, link or cache.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Pull requests run only the jobs their files can affect. Main pushes and the
  # release gate (workflow_call) run everything, including macOS.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      rust: ${{ steps.scope.outputs.rust }}
      desktop: ${{ steps.scope.outputs.desktop }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      # The PR merge commit's first parent is the base, so depth 2 is enough.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            printf 'full=true\nrust=true\ndesktop=true\nweb=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$files"
          has() { printf '%s\n' "$files" | grep -qE "$1|^\.github/workflows/ci\.yml$" && echo true || echo false; }
          {
            echo "full=false"
            echo "rust=$(has '^(Cargo\.(toml|lock)|crates/|services/|apps/desktop/src-tauri/|packages/pytxo/|tooling/|\.cargo/|rust-toolchain)')"
            echo "desktop=$(has '^(apps/desktop/|tooling/)')"
            echo "web=$(has '^(apps/web/|packages/chroma/)')"
          } | tee -a "$GITHUB_OUTPUT"

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # A cold Windows build took 36 minutes before caching; retain that margin.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost ~10x Linux: main pushes and the release gate only.
        os: ${{ fromJSON(needs.changes.outputs.full == 'true' && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Full workspace test binaries nearly fill the hosted Linux disk. Dropping
      # unused preinstalled SDKs leaves room for the feature matrix below.
      - name: Free Linux runner disk
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libfuse3-dev

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build and pin Windows owned-launch test helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p pytxo-cli --bin pytxo-attempt-host --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = (Resolve-Path -LiteralPath target/debug/pytxo-attempt-host.exe).Path
          $digest = (Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant()
          "PYTXO_TEST_ATTEMPT_HOST=$helper" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYTXO_TEST_ATTEMPT_HOST_SHA256=$digest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: Unix reviewed-file mode and recovery matrix
        if: runner.os == 'Linux'
        run: cargo test -p pytxo-runner --test run_change_set unix_

      # Smokes and benchmarks reuse the debug CLI the tests just built instead of
      # compiling it again in separate jobs.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os == 'Linux'
        with:
          node-version: "22"

      - name: Release metadata, npm wrapper, agent-environment smokes and benchmarks (Linux)
        if: runner.os == 'Linux'
        env:
          PYTXO_BIN: ${{ github.workspace }}/target/debug/pytxo
        run: |
          node tooling/scripts/verify-release-version.mjs
          node --test tooling/scripts/encode-png-ico.test.mjs tooling/scripts/verify-release-version.test.mjs tooling/scripts/verify-release-inventory.test.mjs tooling/scripts/verify-windows-runtime.test.mjs
          cargo build -p pytxo-cli
          mkdir -p packages/pytxo/vendor
          cp "$PYTXO_BIN" packages/pytxo/vendor/pytxo
          PYTXO_SKIP_DOWNLOAD=1 node packages/pytxo/bin/pytxo.js --version
          bash tooling/test-envs/ci-smoke.sh
          bash tooling/test-envs/shell-smoke.sh
          bash tooling/benchmarks/three-agent-preflight.sh
          bash tooling/benchmarks/overlay-vs-worktree.sh
          bash tooling/benchmarks/multi-agent-ram.sh

      - name: Agent preflight and overlay benchmark (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p pytxo-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tooling/benchmarks/three-agent-preflight.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tooling/benchmarks/overlay-vs-worktree.ps1

      # Advisories depend on Cargo.lock, not the OS. rust-cache keeps the binary.
      - name: cargo audit
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked 2>/dev/null || true
          cargo audit

      - name: Reclaim Linux disk before feature matrix if needed
        if: runner.os == 'Linux'
        run: |
          df -h .
          [ "$(df --output=avail -k . | tail -1)" -gt 15000000 ] || cargo clean

      - name: Link HTTP reconciler (feature)
        run: |
          cargo test -p pytxo-core --features link-http
          cargo test -p pytxo-orchestrate --test billing_link

      - name: Overlay layer POC (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p pytxo-runner --features overlay-fuse overlay_layer
          # kernel_overlay_smoke needs CAP_SYS_ADMIN; compile-only on CI.
          cargo test -p pytxo-runner --features overlay-fuse-kernel --lib --no-run

      - name: Overlay kernel POC (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p pytxo-runner --features overlay-projfs

      - name: Overlay fuse POC (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p pytxo-runner --features overlay-fuse-macos --lib --no-run

      - name: DeepSpace network isolation (Linux compile)
        if: runner.os == 'Linux'
        run: cargo test -p pytxo-runner network_policy --no-run

      - name: Cloud sandbox client (feature)
        run: |
          cargo test -p pytxo-orchestrate --test cloud_sandbox
          cargo test -p pytxo-orchestrate --test mcp_proxy

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
      - name: npm ci, verify, and build
        working-directory: apps/web
        env:
          # Clerk validates the public key during static prerendering. Production
          # deployments replace this non-routable CI key with the Vercel secret.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: |
          npm ci --legacy-peer-deps
          npm audit --omit=dev --audit-level=high
          npm run lint
          npx playwright install --with-deps chromium
          npm run build
          npm run e2e

  desktop-frontend:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: npm ci and check
        working-directory: apps/desktop
        run: |
          npm ci --prefix ../../tooling
          node ../../tooling/scripts/generate-deck-icons.mjs
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run check
      - name: Playwright shell E2E
        working-directory: apps/desktop
        run: |
          npx playwright install chromium
          npm run e2e
      - name: Storybook build and accessibility gate
        working-directory: apps/desktop
        run: |
          npm run storybook:build
          npm run storybook:test:ci

  # Desktop ships for Windows only; this Linux release build guards main and
  # the release gate. The rust job already runs pytxo-desktop's tests.
  desktop-tauri:
    timeout-minutes: 60
    needs: [changes, desktop-frontend]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: Build release desktop with current frontend
        working-directory: apps/desktop
        run: npm run build:native

