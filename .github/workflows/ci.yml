name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Link HTTP reconciler (feature)
        run: |
          cargo test -p pytxo-core --features link-http
          cargo test -p pytxo-orchestrate --test billing_link

      - name: Overlay layer POC (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo test -p pytxo-runner --features overlay-fuse overlay_layer
          cargo test -p pytxo-runner --features overlay-fuse-kernel -- --ignored kernel_overlay_smoke

      - name: Overlay kernel POC (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p pytxo-runner --features overlay-projfs

      - name: Cloud sandbox client (feature)
        run: |
          cargo test -p pytxo-orchestrate --test cloud_sandbox
          cargo test -p pytxo-orchestrate --test mcp_proxy

  benchmarks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build pytxo CLI
        run: cargo build -p pytxo-cli

      - name: Three-agent preflight (Linux)
        if: runner.os == 'Linux'
        run: bash tooling/benchmarks/three-agent-preflight.sh

      - name: Three-agent preflight (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tooling/benchmarks/three-agent-preflight.ps1

  npm-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build pytxo binary
        run: cargo build -p pytxo-cli --release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke npm wrapper with local binary
        run: |
          mkdir -p packages/pytxo/vendor
          cp target/release/pytxo packages/pytxo/vendor/pytxo
          chmod +x packages/pytxo/vendor/pytxo
          PYTXO_SKIP_DOWNLOAD=1 node packages/pytxo/bin/pytxo.js --version

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/docs/package-lock.json
      - name: npm ci and build
        working-directory: apps/web
        run: |
          npm ci --legacy-peer-deps
          npm run build

  desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: npm ci and check
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check

  desktop-tauri:
    needs: desktop-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        working-directory: apps/desktop
        run: npm ci

      - name: cargo build pytxo-desktop
        run: cargo build -p pytxo-desktop
