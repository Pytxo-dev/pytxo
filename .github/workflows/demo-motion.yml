name: Demo film (private artifact)

# Manual only, to keep renders off the billed minutes until a cut is ready.
# "review" renders stills every two seconds; "film" renders the full master.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "review (stills) or film (full master)"
        type: choice
        options: [review, film]
        default: review

permissions:
  contents: read

concurrency:
  group: demo-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: github.repository == 'Pytxo-dev/pytxo'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/demo-video
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/demo-video
            tooling/benchmarks/results
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/demo-video/package-lock.json
      - name: Install render tools
        run: |
          npm ci
          npm run typecheck
      - name: Review stills
        if: inputs.mode == 'review'
        run: node scripts/film-review.mjs --every 2
      - name: Render the film
        if: inputs.mode == 'film'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          npx remotion render src/index.ts PytxoFilm out/pytxo-film.render.mp4 --codec=h264 --crf=18 --pixel-format=yuv420p --color-space=bt709 --audio-codec=aac --audio-bitrate=256k --sample-rate=48000 --concurrency=4 --overwrite
          node scripts/finalize-master.mjs out/pytxo-film.render.mp4 out/pytxo-film.mp4
          node scripts/film-review.mjs --every 4
      - name: Retain private review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytxo-film-${{ inputs.mode }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            apps/demo-video/out/pytxo-film.mp4
            apps/demo-video/out/film-review/*.jpg
