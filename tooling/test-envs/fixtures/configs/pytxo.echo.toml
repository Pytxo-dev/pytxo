data_dir = ".pytxo/data"
signal_core = true
execution_backend = "pty"

[[agent]]
name = "builder"
paths = ["src/**"]

[[task]]
id = "task-a"
agent = "builder"
paths = ["src/a.ts"]

[[task]]
id = "task-b"
agent = "builder"
paths = ["package.json"]

[[task]]
id = "task-c"
agent = "builder"
paths = ["package.json"]
