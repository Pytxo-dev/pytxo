max_agents = 3
worktree_dir = ".pytxo/worktrees"
data_dir = ".pytxo/data"
signal_core = true
execution_backend = "pty"

[[agent]]
name = "codex-builder"
paths = ["src/**"]
cli_adapter = "generic"

[[task]]
id = "explore-a"
agent = "codex-builder"
paths = ["src/a.ts"]

[[task]]
id = "explore-b"
agent = "codex-builder"
paths = ["package.json"]
