services:
  pytxo-link:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      LINK_BIND: "0.0.0.0:8787"
      LINK_API_KEY: ${LINK_API_KEY:-dev-link-key}
      LINK_REQUIRE_AUTH: ${LINK_REQUIRE_AUTH:-1}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_PRO: ${PADDLE_PRICE_PRO:-}
      PADDLE_PRICE_MAX: ${PADDLE_PRICE_MAX:-}
      PADDLE_PRICE_ULTRA: ${PADDLE_PRICE_ULTRA:-}
      DODO_WEBHOOK_SECRET: ${DODO_WEBHOOK_SECRET:-}
      DODO_BUSINESS_ID: ${DODO_BUSINESS_ID:-}
      DODO_BRAND_ID: ${DODO_BRAND_ID:-}
      DODO_PRODUCT_PRO: ${DODO_PRODUCT_PRO:-}
      DODO_PRODUCT_MAX: ${DODO_PRODUCT_MAX:-}
      DODO_PRODUCT_ULTRA: ${DODO_PRODUCT_ULTRA:-}
      RUST_LOG: info
