[package]
name = "pytxo-link"
version = "0.1.0"
edition = "2021"
description = "Reference Pytxo Link billing reconcile service"
license = "MIT"

[[bin]]
name = "pytxo-link"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
