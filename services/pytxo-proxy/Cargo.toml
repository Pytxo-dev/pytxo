[package]
name = "pytxo-proxy"
version = "0.3.3"
edition = "2021"
description = "Pytxo Ultra managed-inference proxy (ADR-0019)"
license = "MIT"

[[bin]]
name = "pytxo-proxy"
path = "src/main.rs"

[dependencies]
axum = "0.8"
bytes = "1.9"
futures-util = "0.3"
http-body-util = "0.1"
pytxo-core = { workspace = true }
reqwest = { version = "0.12", features = ["stream", "rustls-tls", "json"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
