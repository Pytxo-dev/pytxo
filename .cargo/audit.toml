[advisories]
# tauri-plugin-notification 2.3.3 currently pins tauri-winrt-notification
# 0.7.x, whose quick-xml 0.37.x dependency cannot be upgraded in-place
# without replacing the notification plugin. Keep the advisories visible in
# audit output but allow the release gate to proceed with this documented,
# Windows-notification-only transitive exception.
# `rsa` has no fixed release for RUSTSEC-2023-0071; it is pulled by the
# macOS/desktop dependency graph and is not used for Pytxo's key handling.
# RUSTSEC-2026-0459 (C SQLite before 3.54.0, CVE-2026-119375) is fixed in
# libsqlite3-sys 0.39, which needs rusqlite 0.41. sqlx, which pytxo-link uses
# for Postgres only, still links sqlite3 through libsqlite3-sys below 0.38,
# and Cargo allows one sqlite3 link per workspace. The flaw needs a crafted
# database and -wal file pair opened locally; Pytxo opens only databases it
# created in its own data directory. Remove this once sqlx accepts 0.39, or
# move pytxo-link to its own workspace.
ignore = [
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  "RUSTSEC-2023-0071",
  "RUSTSEC-2026-0459",
]
