[package]
name = "pytxo-runner"
description = "Git worktree and process execution for Pytxo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
glob = "0.3"
portable-pty = { workspace = true }
pytxo-core = { workspace = true }
pytxo-signal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pytxo-store = { workspace = true }
tempfile = "3.14"
tokio = { workspace = true }

[features]
default = []
deepspace-netns = [] # retained alias; Linux netns is default-on (ADR-0026)
overlay-fuse = []
overlay-fuse-kernel = ["dep:fuser"]
overlay-fuse-macos = []
overlay-projfs = []

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.16", optional = true }

[target.'cfg(all(unix, not(target_os = "linux")))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_SystemServices"] }
