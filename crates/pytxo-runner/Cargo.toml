[package]
name = "pytxo-runner"
description = "Git worktree and process execution for Pytxo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
anyhow = { workspace = true }
fs2 = { workspace = true }
glob = "0.3"
portable-pty = { workspace = true }
pytxo-core = { workspace = true }
pytxo-signal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
pytxo-store = { workspace = true }
tempfile = "3.14"
tokio = { workspace = true }

[features]
default = []
deepspace-netns = [] # retained alias; Linux netns is default-on (ADR-0026)
overlay-fuse = []
overlay-fuse-kernel = ["dep:fuser"]
overlay-fuse-macos = []
overlay-projfs = []

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "0.14", optional = true }
