[package]
name = "pytxo-voice"
description = "Local-first bounded voice capture and transcription contracts for Pytxo Flow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
cpal = { version = "0.17.3", optional = true }
whisper-rs = { version = "0.16.0", optional = true }

[features]
default = []
native-capture = ["dep:cpal"]
local-whisper = ["dep:whisper-rs"]
native-voice = ["native-capture", "local-whisper"]

[dev-dependencies]
tempfile = "3.14"
