[package]
name = "pytxo-orchestrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
pytxo-core = { workspace = true }
pytxo-planner.workspace = true
pytxo-runner.workspace = true
pytxo-scheduler.workspace = true
pytxo-store.workspace = true
pytxo-signal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
regex.workspace = true
toml.workspace = true

pytxo-sanitize = { path = "../pytxo-sanitize", optional = true }
ureq = { version = "2.12", optional = true }

[features]
default = ["sanitize", "link-http", "cloud-http"]
sanitize = ["dep:pytxo-sanitize"]
link-http = ["pytxo-core/link-http", "dep:ureq"]
cloud-http = ["pytxo-core/cloud-http"]
billing-tiktoken = ["pytxo-core/billing-tiktoken"]

[dev-dependencies]
rusqlite.workspace = true
tempfile = "3.14"
tokio = { workspace = true }
