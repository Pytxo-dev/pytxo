[package]
name = "pytxo-cli"
default-run = "pytxo"
description = "Pytxo command-line control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pytxo"
path = "src/main.rs"

[[bin]]
name = "pytxo-attempt-host"
path = "src/bin/pytxo-attempt-host.rs"

[[bin]]
name = "experimental-routing-trace-export"
path = "src/bin/experimental-routing-trace-export.rs"
required-features = ["experimental-routing-benchmark"]

[features]
experimental-routing-benchmark = []

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
pytxo-catalog = { workspace = true }
pytxo-core = { workspace = true }
pytxo-runner = { workspace = true }
pytxo-orchestrate = { path = "../pytxo-orchestrate", features = ["sanitize", "link-http", "cloud-http"] }
pytxo-shell = { path = "../pytxo-shell" }
pytxo-store = { workspace = true }
pytxo-tui = { path = "../pytxo-tui" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
