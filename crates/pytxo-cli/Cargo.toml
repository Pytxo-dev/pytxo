[package]
name = "pytxo-cli"
description = "Pytxo command-line control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pytxo"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
pytxo-catalog = { workspace = true }
pytxo-core = { workspace = true }
pytxo-orchestrate = { path = "../pytxo-orchestrate", features = ["sanitize"] }
pytxo-tui = { path = "../pytxo-tui" }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
