[package]
name = "pytxo-cli"
default-run = "pytxo"
description = "Check that your coding agents' branches pass together"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "pytxo"
path = "src/main.rs"

[[bin]]
name = "pytxo-attempt-host"
path = "src/bin/pytxo-attempt-host.rs"
required-features = ["full"]

[[bin]]
name = "experimental-routing-trace-export"
path = "src/bin/experimental-routing-trace-export.rs"
required-features = ["experimental-routing-benchmark"]

[features]
default = ["full"]
# The frozen 1.x commands (shell, runs, missions, fleets, accounts, Review/Apply
# of runs). Release builds for npm pass --no-default-features: the check alone.
full = [
    "dep:base64",
    "dep:getrandom",
    "dep:sha2",
    "dep:ureq",
    "dep:pytxo-catalog",
    "dep:pytxo-orchestrate",
    "dep:pytxo-runner",
    "dep:pytxo-shell",
    "dep:pytxo-store",
    "dep:pytxo-tui",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:uuid",
]
experimental-routing-benchmark = ["full"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
pytxo-core = { workspace = true }
pytxo-land = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true, optional = true }
getrandom = { version = "0.2", optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "2.12", features = ["json"], optional = true }
pytxo-catalog = { workspace = true, optional = true }
pytxo-orchestrate = { path = "../pytxo-orchestrate", features = ["sanitize", "link-http", "cloud-http"], optional = true }
pytxo-runner = { workspace = true, optional = true }
pytxo-shell = { path = "../pytxo-shell", optional = true }
pytxo-store = { workspace = true, optional = true }
pytxo-tui = { path = "../pytxo-tui", optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.14"
