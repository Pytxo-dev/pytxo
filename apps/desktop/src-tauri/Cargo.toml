[package]
name = "pytxo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pytxo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pytxo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-updater = { workspace = true }
tokio.workspace = true
pytxo-core = { path = "../../../crates/pytxo-core" }
pytxo-store = { path = "../../../crates/pytxo-store" }
pytxo-orchestrate = { path = "../../../crates/pytxo-orchestrate", features = ["sanitize", "link-http"] }
keyring = "3"
