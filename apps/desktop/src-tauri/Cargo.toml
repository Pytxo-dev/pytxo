[package]
name = "pytxo-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "pytxo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]
doctest = false

[[bin]]
name = "pytxo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
base64.workspace = true
getrandom = "0.2"
sha2 = "0.10"
uuid.workspace = true
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-shell = { workspace = true }
tauri-plugin-process = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-single-instance = { workspace = true, features = ["deep-link"] }
tokio.workspace = true
portable-pty.workspace = true
pytxo-core = { path = "../../../crates/pytxo-core" }
pytxo-planner = { path = "../../../crates/pytxo-planner" }
pytxo-store = { path = "../../../crates/pytxo-store" }
pytxo-orchestrate = { path = "../../../crates/pytxo-orchestrate", features = ["sanitize", "link-http"] }
pytxo-signal = { path = "../../../crates/pytxo-signal" }
pytxo-runner = { path = "../../../crates/pytxo-runner" }
pytxo-voice = { path = "../../../crates/pytxo-voice", features = ["native-capture"] }
keyring = "3"
rfd = "0.15"
ureq = "2.12"
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"], default-features = false }
tauri-plugin-mcp-bridge = { version = "0.11", optional = true }

[target.'cfg(windows)'.dependencies]
# Reuse the exact renderer and Windows bindings already locked through Tauri.
wry = { version = "=0.55.1", default-features = false, features = ["os-webview"] }
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
winreg = "0.52"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]
voice-whisper = ["pytxo-voice/local-whisper"]
# Verification-only automation bridge; never enabled by CI/release builds.
mcp-bridge = ["tauri-plugin-mcp-bridge"]

[dev-dependencies]
tempfile = "3.14"
axum = "0.8"
tokio = { workspace = true, features = ["net"] }
